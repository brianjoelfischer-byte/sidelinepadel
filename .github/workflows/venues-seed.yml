name: Sedes · OpenStreetMap

# Baja las sedes de pádel de OSM y guarda un SQL por país en
# supabase/seed/venues/. Corre acá y no en la app porque es la única parte que
# habla con Overpass, y tiene que hacerlo pocas veces (§13).
#
# Se dispara al cambiar la lista de países o el código que la procesa.
on:
  push:
    branches: ['**']
    paths:
      - 'supabase/seed/venues/countries.txt'
      - 'scripts/venues-fetch.mjs'
      - 'scripts/lib/osm-venues.mjs'
      - '.github/workflows/venues-seed.yml'
  workflow_dispatch:

# Escribe en el repo: sube los SQL generados.
permissions:
  contents: write

# Nunca dos a la vez sobre la misma rama: la segunda chocaría al subir. La
# nueva reemplaza a la vieja: si se cambió el código, la corrida anterior ya
# está bajando con la versión equivocada (y puede estar trabada esperando a
# Overpass, como pasó con la consulta sin índice espacial).
concurrency:
  group: venues-seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Bajar sedes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Solo para este job. En package.json obligaría a todas las máquinas a
      # reinstalar por algo que nunca usan.
      - name: Zona horaria por coordenadas
        run: npm install --no-save @photostructure/tz-lookup@11

      - name: Consultar OpenStreetMap
        run: node scripts/venues-fetch.mjs $(grep -v '^#' supabase/seed/venues/countries.txt | tr '\n' ' ')

      # `always()`: si un país falla, los que salieron bien se suben igual.
      - name: Subir los SQL generados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/seed/venues/*.sql 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios en las sedes."
            exit 0
          fi
          git commit -m "Sedes: actualizar desde OpenStreetMap" \
                     -m "Generado por .github/workflows/venues-seed.yml. Datos © colaboradores de OpenStreetMap, ODbL."
          # Si alguien subió algo mientras esto corría, se acomoda encima.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
