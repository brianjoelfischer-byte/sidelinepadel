name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Una corrida por rama: un push nuevo cancela la anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` y no `install`: falla si el lockfile no coincide con package.json,
      # en vez de resolver versiones distintas a las que se probaron.
      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests de unidad
        run: npm run test:unit

      - name: Build
        run: npm run build

  rls:
    name: Políticas RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostGIS y no `postgres` a secas: el esquema usa geography (§13).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aplicar migraciones
        run: node scripts/db-migrate.mjs --reset

      # El paso que importa: verifica que un usuario no pueda leer ni escribir
      # lo de otro. Si esto falla, no se mergea (§09, bloque 2).
      - name: Tests de RLS
        run: npm run test:rls

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regla 30 del BLUEPRINT: una vulnerabilidad alta o crítica bloquea.
      # Las moderadas se reportan pero no frenan el merge.
      - name: npm audit (bloquea en high y critical)
        run: npm audit --audit-level=high

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks necesita el historial completo para revisar los commits
          # del push, no solo el árbol final.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
